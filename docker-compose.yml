version: "3.9"
services:
  backend:
    build: ./backend
    container_name: cloudtasker-backend
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    container_name: cloudtasker-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
