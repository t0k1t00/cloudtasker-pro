apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudtasker-frontend
  namespace: cloudtasker
  labels:
    app: cloudtasker-frontend
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudtasker-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: cloudtasker-frontend
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: cloudtasker-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: cloudtasker-frontend-svc
  namespace: cloudtasker
  labels:
    app: cloudtasker-frontend
spec:
  type: NodePort
  selector:
    app: cloudtasker-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
      name: http
